name: ALADIN — premium identity and mechanical financial engine

on:
  push:
    branches: [DEV/WORKSPACE-PORTFOLIO-2026-09-03]
    paths:
      - '.github/workflows/aladin-theme-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DEV/WORKSPACE-PORTFOLIO-2026-09-03
          fetch-depth: 0
      - name: Redesign ALADIN main page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('WORKSPACE/ALADIN/RELEASE/index.html')
          js = Path('WORKSPACE/ALADIN/RELEASE/aladin.js')
          s = index.read_text(encoding='utf-8')

          css = r'''<style>/* ALADIN PREMIUM IDENTITY v2 + MECHANICAL FINANCIAL ENGINE */
          :root{--bg:#0b0e10;--p:#151a1d;--l:#3a4248;--g:#c6a06f;--t:#f2eee7;--m:#a9b0b3;--a:#819b91;--steel:#69757d;--deep:#101416}
          body{background:radial-gradient(circle at 78% 0,#283039 0,#11171a 26%,#0b0e10 58%)!important;color:var(--t)!important}
          .top{border-color:#343d43!important}.brand{color:var(--g)!important}.brand span{color:#e8e4dc!important}.badge{color:#b7bebf!important;border-color:#566067!important;background:rgba(255,255,255,.025)}
          .hero h1,.title,.screen h3{color:#f3efe8!important}.hero p,.lead{color:#c8ced0!important}.k{color:var(--g)!important}.photo{border:1px solid #566067;box-shadow:0 28px 80px rgba(0,0,0,.42)}
          .roles{gap:12px}.role{background:linear-gradient(145deg,#1a2023,#111618)!important;border-color:#3d474d!important;box-shadow:0 12px 32px rgba(0,0,0,.2);transition:.25s}.role:hover{transform:translateY(-4px);border-color:#727c82!important;box-shadow:0 20px 48px rgba(0,0,0,.32)}.role.active{border-color:var(--g)!important;box-shadow:0 0 0 1px rgba(198,160,111,.22) inset,0 20px 50px rgba(0,0,0,.34)}
          .panel{background:linear-gradient(145deg,#181e21,#0f1416)!important;border-color:#8f7453!important;box-shadow:0 28px 80px rgba(0,0,0,.4)}.head{background:linear-gradient(90deg,rgba(198,160,111,.1),transparent);border-color:#343d43!important}.nav{background:#0e1315!important}.nav button{background:#171d20!important;border-color:#424b51!important;color:#aeb5b8!important}.nav button.active{border-color:var(--g)!important;color:#d5b181!important;background:rgba(198,160,111,.08)!important}
          .screen{background:radial-gradient(circle at 100% 0,rgba(129,155,145,.12),transparent 40%)!important}.point{background:linear-gradient(145deg,#171d20,#111618)!important;border-color:#39434a!important}.point:hover{border-color:#6c777d!important}.point b{color:var(--g)!important}.visual{border:1px solid #505b62;box-shadow:0 24px 70px rgba(0,0,0,.4)!important}
          .controls{background:#0e1315!important;border-color:#343d43!important}.btn{background:linear-gradient(135deg,#c6a06f,#a98258)!important;color:#101214!important;border-color:#d0ae80!important;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:.2s}.btn.alt{background:transparent!important;color:#ece8e1!important;border-color:#687177!important}.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}
          .calculator{position:relative;overflow:hidden;background:linear-gradient(145deg,#171d20,#0d1214)!important;border:1px solid #59646b!important;border-radius:18px!important;padding:14px!important;box-shadow:0 28px 80px rgba(0,0,0,.42)!important}.calculator:before{content:'ALADIN / ENGINE';position:absolute;right:18px;top:8px;font:800 11px/1 Inter,system-ui,sans-serif;letter-spacing:.2em;color:rgba(198,160,111,.34);pointer-events:none}.calculator:after{content:'∫  ∂  Δ  d/dt  Σ  ROI';position:absolute;right:18px;bottom:10px;font:600 12px/1 ui-monospace,monospace;letter-spacing:.16em;color:rgba(198,160,111,.13);pointer-events:none}.calcTop{margin-bottom:10px!important}.calcTop h3{font:700 25px/1.05 Georgia,serif!important;margin:3px 0!important}.calcTop .muted{font-size:12px!important;max-width:760px}.calcActions{gap:6px}.calcActions .btn{padding:7px 10px;font-size:11px}.calcGrid{grid-template-columns:1.12fr .88fr!important;gap:8px!important}.field{display:grid;gap:4px;background:linear-gradient(145deg,#151b1e,#111618)!important;border:1px solid #374148!important;border-radius:9px!important;padding:8px!important;min-width:0;transition:.18s}.field:hover{border-color:#606c73!important}.field:focus-within{border-color:var(--g)!important;box-shadow:0 0 0 1px rgba(198,160,111,.14) inset!important}.field label{font-size:9px!important;color:#aeb6b9!important;letter-spacing:.11em}.field input,.field select{padding:8px 9px!important;border:1px solid #414b52!important;background:#0b1012!important;color:#f0ece5!important;border-radius:7px!important;font-size:13px}.field input:focus,.field select:focus{border-color:var(--g)!important;box-shadow:0 0 0 2px rgba(198,160,111,.08)!important}.calcOut{margin-top:0!important;border-top:0!important;background:#0b1012;border:1px solid #374148;border-radius:11px;padding:8px;max-height:440px;overflow:auto}.calcOut:before{content:'MODEL OUTPUT  /  LIVE';display:block;padding:3px 4px 7px;color:#aab3b7;font:700 9px/1 ui-monospace,monospace;letter-spacing:.16em;border-bottom:1px solid #2b343a}.calcRow{padding:6px 5px!important;border-color:#263036!important;font-size:11px!important}.calcRow span{color:#aeb6b9!important}.calcRow b{color:var(--g)!important;font-family:ui-monospace,SFMono-Regular,monospace}.calcFoot{margin-top:7px!important;font-size:9px!important}.kpis{gap:7px!important;margin:9px 0!important}.kpis>div{padding:10px!important;background:#141a1d!important;border-color:#3c474e!important}.kpis b{font-size:19px!important;color:var(--g)!important}.kpis small{font-size:9px!important;color:#9da6aa!important}.form input,.form select,.form textarea{background:#111719!important;border-color:#39434a!important}.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--g)!important}.card{background:linear-gradient(145deg,#171d20,#111618)!important;border-color:#3d474d!important}
          .engine-shell{display:grid;grid-template-columns:1fr 190px;gap:8px;align-items:stretch}.engine-fields{min-width:0}.engine-side{position:relative;border:1px solid #374148;border-radius:11px;background:radial-gradient(circle at 50% 35%,#20282d,#0b1012 72%);overflow:hidden;min-height:100%;display:flex;align-items:center;justify-content:center}.engine-side svg{width:150px;height:150px;opacity:.82}.gear{transform-origin:50% 50%;animation:aladinGear 18s linear infinite}.gear.small{animation-direction:reverse;animation-duration:11s}.engine-formula{position:absolute;left:10px;bottom:9px;right:10px;padding:7px;border:1px solid rgba(198,160,111,.22);border-radius:7px;background:rgba(5,8,9,.72);color:#bba47f;font:600 9px/1.5 ui-monospace,monospace;letter-spacing:.05em;text-align:center}.engine-pulse{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:#a9c1b5;box-shadow:0 0 12px rgba(169,193,181,.8);animation:enginePulse 1.8s ease-in-out infinite}.engine-tag{position:absolute;top:9px;left:9px;color:#858f94;font:700 8px/1 ui-monospace,monospace;letter-spacing:.12em}@keyframes aladinGear{to{transform:rotate(360deg)}}@keyframes enginePulse{50%{opacity:.35;transform:scale(.72)}}
          @media(max-width:900px){.engine-shell{grid-template-columns:1fr}.engine-side{min-height:150px}.engine-side svg{width:120px;height:120px}.calcGrid{grid-template-columns:1fr!important}.calcOut{max-height:360px}}@media(max-width:480px){.calculator{padding:10px!important}.calculator:before,.calculator:after{display:none}.calcTop h3{font-size:22px!important}.engine-side{display:none}.field{padding:7px!important}}
          </style>'''

          marker_re = re.compile(r'<style>/\* ALADIN STANDALONE IDENTITY v1 \*/.*?</style>', re.S)
          if marker_re.search(s):
              s = marker_re.sub(css, s, count=1)
          else:
              s = s.replace('</head>', css+'</head>', 1)
          index.write_text(s, encoding='utf-8')

          js_s = js.read_text(encoding='utf-8')
          marker = '/* ALADIN MECHANICAL FINANCIAL ENGINE v3 */'
          if marker not in js_s:
              addon = r'''

/* ALADIN MECHANICAL FINANCIAL ENGINE v3 */
(function(){
  const mount=()=>{
    const c=document.querySelector('#calculator .calculator');
    if(!c || c.querySelector('.engine-side')) return;
    const grid=c.querySelector('.calcGrid');
    if(!grid) return;
    const wrap=document.createElement('div'); wrap.className='engine-shell';
    const fields=document.createElement('div'); fields.className='engine-fields';
    const side=document.createElement('div'); side.className='engine-side';
    side.innerHTML=`<span class="engine-tag">MECHANICAL CORE</span><span class="engine-pulse"></span><svg viewBox="0 0 200 200" aria-hidden="true"><g class="gear"><circle cx="100" cy="100" r="47" fill="none" stroke="#c6a06f" stroke-width="9" stroke-dasharray="8 5"/><circle cx="100" cy="100" r="24" fill="none" stroke="#7c888e" stroke-width="5"/><path d="M100 22v28M100 150v28M22 100h28M150 100h28M45 45l20 20M135 135l20 20M155 45l-20 20M65 135l-20 20" stroke="#c6a06f" stroke-width="7" stroke-linecap="square"/></g><g class="gear small"><circle cx="47" cy="48" r="24" fill="none" stroke="#819b91" stroke-width="6" stroke-dasharray="6 4"/><circle cx="47" cy="48" r="10" fill="none" stroke="#68757c" stroke-width="4"/></g></svg><div class="engine-formula">∫₀ᵀ CF(t)dt → NPV<br>∂ROI/∂K · ΔMargin · dV/dt<br>Σ COST → MODEL OUTPUT</div>`;
    const parent=grid.parentElement;
    parent.insertBefore(wrap,grid); wrap.appendChild(fields); wrap.appendChild(side); fields.appendChild(grid);
    const out=c.querySelector('#calcOut'); if(out){const foot=c.querySelector('.calcFoot'); fields.appendChild(out); if(foot) fields.appendChild(foot);}
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
})();
'''
              js.write_text(js_s+addon, encoding='utf-8')
          PY
      - name: Commit ALADIN redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WORKSPACE/ALADIN/RELEASE/index.html WORKSPACE/ALADIN/RELEASE/aladin.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'ALADIN: premium visual identity and mechanical financial engine'
            git push origin HEAD:DEV/WORKSPACE-PORTFOLIO-2026-09-03
          fi
