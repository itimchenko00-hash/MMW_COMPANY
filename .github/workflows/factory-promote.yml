name: FACTORY — Promote READY to RELEASE

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to promote'
        required: true
        type: choice
        options:
          - MMW-COMPANY
          - ALADIN
          - NEXUS-WORK
          - NEXUS-LOGISTICS
          - CARPATHIA
          - AGROHUB
          - ENERGY-PARK

permissions:
  contents: write

concurrency:
  group: factory-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FACTORY branch
        uses: actions/checkout@v6
        with:
          ref: DEV/WORKSPACE-PORTFOLIO-2026-09-03
          fetch-depth: 0

      - name: Validate project boundary
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          case "$PROJECT" in
            MMW-COMPANY|ALADIN|NEXUS-WORK|NEXUS-LOGISTICS|CARPATHIA|AGROHUB|ENERGY-PARK) ;;
            *) echo "Invalid project"; exit 1 ;;
          esac
          test -d "WORKSPACE/$PROJECT/READY"
          echo "Promoting only WORKSPACE/$PROJECT"

      - name: Archive previous RELEASE and promote READY
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          root="WORKSPACE/$PROJECT"
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          if [ -n "$(find "$root/RELEASE" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            mkdir -p "$root/ARCHIVE/$stamp"
            cp -a "$root/RELEASE/." "$root/ARCHIVE/$stamp/"
          fi
          rm -rf "$root/RELEASE"
          mkdir -p "$root/RELEASE"
          cp -a "$root/READY/." "$root/RELEASE/"
          test -f "$root/RELEASE/index.html"

      - name: Commit only FACTORY promotion
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "WORKSPACE/$PROJECT/READY" "WORKSPACE/$PROJECT/RELEASE" "WORKSPACE/$PROJECT/ARCHIVE"
          git diff --cached --quiet && { echo "No promotion changes"; exit 0; }
          git commit -m "FACTORY: promote $PROJECT READY to RELEASE"
          git push origin HEAD:DEV/WORKSPACE-PORTFOLIO-2026-09-03
