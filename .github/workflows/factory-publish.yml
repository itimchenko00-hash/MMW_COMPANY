name: FACTORY — Publish RELEASE portfolio

on:
  workflow_dispatch:
  push:
    branches:
      - DEV/WORKSPACE-PORTFOLIO-2026-09-03
    paths:
      - 'WORKSPACE/*/RELEASE/**'
      - 'WORKSPACE/*/READY/**'
      - '.github/workflows/factory-publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: factory-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout FACTORY only
        uses: actions/checkout@v6
        with:
          ref: DEV/WORKSPACE-PORTFOLIO-2026-09-03
          sparse-checkout: |
            WORKSPACE
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build isolated publication site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMW-COMPANY FACTORY</title><style>body{font-family:system-ui;margin:40px;max-width:900px}a{display:block;padding:12px 0}</style></head><body><h1>MMW-COMPANY — FACTORY</h1><p>Published RELEASE packages only.</p>
          HTML
          projects=(MMW-COMPANY ALADIN NEXUS-WORK NEXUS-LOGISTICS CARPATHIA AGROHUB ENERGY-PARK)
          for project in "${projects[@]}"; do
            src="WORKSPACE/${project}/RELEASE"
            if [ -f "$src/index.html" ]; then
              mkdir -p "_site/${project}"
              cp -a "$src/." "_site/${project}/"
              printf '<a href="./%s/">%s</a>\n' "$project" "$project" >> _site/index.html
            fi
          done
          printf '</body></html>\n' >> _site/index.html
          test -f _site/index.html
          echo "Publication contains only RELEASE packages"

      - name: Upload FACTORY publication artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          name: factory-pages-${{ github.run_id }}

      - name: Deploy FACTORY publication
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: factory-pages-${{ github.run_id }}
