name: FACTORY — TEST all projects

on:
  push:
    branches:
      - DEV/WORKSPACE-PORTFOLIO-2026-09-03
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FACTORY
        uses: actions/checkout@v6
        with:
          ref: DEV/WORKSPACE-PORTFOLIO-2026-09-03
          fetch-depth: 2

      - name: Verify FACTORY boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "DEV/WORKSPACE-PORTFOLIO-2026-09-03"
          test -d WORKSPACE
          echo "FACTORY branch verified"

      - name: Verify project lifecycle
        shell: bash
        run: |
          set -euo pipefail
          projects=(MMW-COMPANY ALADIN NEXUS-WORK NEXUS-LOGISTICS CARPATHIA AGROHUB ENERGY-PARK)
          stages=(DEV TEST STAGE READY RELEASE ARCHIVE)
          for project in "${projects[@]}"; do
            for stage in "${stages[@]}"; do
              test -d "WORKSPACE/${project}/${stage}"
            done
          done
          echo "All project lifecycle stages exist"

      - name: Verify publication packages
        shell: bash
        run: |
          set -euo pipefail
          for project in MMW-COMPANY ALADIN NEXUS-WORK NEXUS-LOGISTICS CARPATHIA AGROHUB ENERGY-PARK; do
            if [ -f "WORKSPACE/${project}/RELEASE/index.html" ]; then
              echo "READY: ${project} has a release entrypoint"
            else
              echo "INFO: ${project} has no release entrypoint yet"
            fi
          done

      - name: Verify no project writes outside FACTORY
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            bad=$(git diff --name-only HEAD^ HEAD | grep -vE '^(WORKSPACE/|\.github/workflows/)' || true)
            if [ -n "$bad" ]; then
              echo "Forbidden change outside FACTORY:"
              echo "$bad"
              exit 1
            fi
          fi
          echo "Isolation check passed"
