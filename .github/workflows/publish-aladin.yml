name: FACTORY — Publish ALADIN

on:
  workflow_dispatch:
  push:
    branches:
      - DEV/WORKSPACE-PORTFOLIO-2026-09-03
    paths:
      - 'WORKSPACE/ALADIN/**'
      - '.github/workflows/publish-aladin.yml'

# FACTORY ISOLATION:
# Only the factory branch and WORKSPACE/ALADIN path can trigger this workflow.
# No main, frozen branch, or other project is read or deployed.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: factory-aladin-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout FACTORY ALADIN only
        uses: actions/checkout@v4
        with:
          ref: DEV/WORKSPACE-PORTFOLIO-2026-09-03
          sparse-checkout: |
            WORKSPACE/ALADIN
          sparse-checkout-cone-mode: true

      - name: Package ALADIN only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./WORKSPACE/ALADIN

      - name: Deploy ALADIN Factory Copy
        id: deployment
        uses: actions/deploy-pages@v4
