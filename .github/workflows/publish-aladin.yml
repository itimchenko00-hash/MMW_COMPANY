name: FACTORY — Publish ALADIN

on:
  workflow_dispatch:
  push:
    branches:
      - DEV/WORKSPACE-PORTFOLIO-2026-09-03
    paths:
      - 'WORKSPACE/ALADIN/**'
      - '.github/workflows/publish-aladin.yml'

# FACTORY ISOLATION CONTRACT:
# - Source is ONLY the FACTORY branch below.
# - Published files are ONLY WORKSPACE/ALADIN.
# - main, frozen branches, reserves and other projects are never deployed by this workflow.
# - Each project will have its own workflow and concurrency group.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: factory-aladin-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout FACTORY ALADIN only
        uses: actions/checkout@v6
        with:
          ref: DEV/WORKSPACE-PORTFOLIO-2026-09-03
          sparse-checkout: |
            WORKSPACE/ALADIN
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify ALADIN publication boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f WORKSPACE/ALADIN/index.html
          test -d WORKSPACE/ALADIN
          echo "FACTORY source verified: WORKSPACE/ALADIN"

      - name: Package ALADIN only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./WORKSPACE/ALADIN

      - name: Deploy ALADIN Factory Copy
        id: deployment
        uses: actions/deploy-pages@v4
