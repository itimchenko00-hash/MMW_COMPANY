<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGROHUB — Presentation Suite</title><style>:root{--b:#080d09;--p:#142018;--t:#f5f1e6;--m:#aeb9ad;--g:#d7ad59;--l:#304336}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px Arial,sans-serif}.top{position:sticky;top:0;z-index:5;padding:14px 4vw;background:#080d09ed;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:2px}.nav button{background:none;border:1px solid var(--l);color:var(--t);padding:7px 10px;margin:2px;border-radius:20px}.track{max-width:1240px;margin:auto;padding:30px 4vw 70px}.hero{min-height:76vh;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.hero h1{font:clamp(50px,8vw,96px) Georgia;color:var(--g);margin:10px 0}.lead{font-size:22px;line-height:1.45;color:#ddd8cb}.eyebrow{color:var(--g);letter-spacing:3px;font-size:12px;font-weight:700}.photo{height:460px;border-radius:18px;background:center/cover;border:1px solid var(--l)}.section{border-top:1px solid var(--l)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(145deg,#142119,#0d1510);border:1px solid var(--l);border-radius:16px;padding:21px;min-height:155px}.num{color:var(--g);font-size:12px}.card b{display:block;font-size:19px;margin:9px 0}.muted{color:var(--m);line-height:1.5}.bar{height:8px;background:#203329;border-radius:8px;margin-top:14px}.bar i{display:block;height:100%;background:var(--g)}.flow{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px}.flow span{border:1px solid var(--l);padding:10px 12px;border-radius:10px}.arrow{color:var(--g)}.cta{border:1px solid #6f5930;border-radius:18px;padding:32px;background:#15150f}.cta h2{font:38px Georgia;margin:10px 0}@media(max-width:800px){.hero{grid-template-columns:1fr}.photo{height:300px}.grid{grid-template-columns:1fr}.top{display:block}}
</style></head><body><div class="top"><div class="brand">MMW-COMPANY / AGROHUB</div><div class="nav"><button onclick="show('investor')">INVESTOR</button><button onclick="show('team')">TEAM</button><button onclick="show('partner')">PARTNER</button></div></div><main id="app"></main><script>const photos=['https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1400&q=85','https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?auto=format&fit=crop&w=1400&q=85','https://images.unsplash.com/photo-1530507629858-e4977d30e9a0?auto=format&fit=crop&w=1400&q=85'];const D={investor:{q:'Почему капитал должен работать в AGROHUB?',s:'Инфраструктура, которая превращает агросырьё в более высокую добавленную стоимость: хранение, обработка, упаковка и логистика.',x:[['01','ПРОБЛЕМА','Сырьевой экспорт ограничивает добавленную стоимость; переработка требует инфраструктуры, капитала и логистики.'],['02','ПРОДУКТ','Силосы/склады + переработка + упаковка + лаборатория + логистика в одном промышленном контуре.'],['03','СЫРЬЁ','Зерновые, масличные и другие локальные агропотоки — состав определяется регионом и ТЭО.'],['04','VALUE ADD','Каждая дополнительная стадия обработки создаёт новый источник маржи, но требует CAPEX и рынка сбыта.'],['05','РЫНКИ','Украина + ЕС и другие экспортные направления при соблюдении требований качества, traceability и логистики.'],['06','CAPEX','Земля, storage, processing line, utilities, packaging, laboratory, roads и energy.'],['07','REVENUE','Хранение, переработка, фасовка, контрактное производство, логистика и продажа готового продукта.'],['08','ЭНЕРГИЯ','Резервирование и энергоэффективность критичны для непрерывности промышленного процесса.'],['09','КОНТРОЛЬ','Качество сырья, HACCP/стандарты, traceability, лаборатория и производственная дисциплина.'],['10','РИСКИ','Цена сырья, урожай, экспортные коридоры, энергия, спрос, CAPEX, regulation и FX.'],['11','ФИНАНСИРОВАНИЕ','Возможны equity, debt, грантовые/государственные инструменты при соответствии требованиям.'],['12','ROADMAP','Площадка → сырьё → ТЭО → технологическая линия → финансирование → строительство → запуск.'],['13','МАСШТАБ','Один региональный хаб → сеть переработки и логистики.'],['14','ЭКСПОРТ','Украинская агропродукция уже имеет глобальный рынок; задача — увеличивать долю value-added.'],['15','ФИНАЛ','AGROHUB — промышленная инвестиционная гипотеза, которую подтверждают сырьевая база, off-take и ТЭО.']]},team:{q:'Почему я хочу создавать агропромышленную систему?',s:'От поля до готового продукта — одна команда управляет цепочкой.',x:[['01','ТЕХНОЛОГ','Выбор линии, capacity, automation и quality control.'],['02','ENGINEERING','Электрика, вода, тепло, вентиляция, пожарная безопасность и process utilities.'],['03','PRODUCTION','SOP, OEE, yield, quality, maintenance и сменная организация.'],['04','LOGISTICS','Приёмка, хранение, внутренняя логистика, отгрузка и экспорт.'],['05','QUALITY','Лаборатория, traceability, стандарты и food safety.'],['06','COMMERCIAL','Off-take, экспорт, B2B-контракты и private label.'],['07','DIGITAL','ERP/MES/WMS, производственная аналитика и traceability.'],['08','ENERGY','Энергоэффективность, резервирование и устойчивость производства.'],['09','КОГО ИЩЕМ','Агрономы, технологи, инженеры, логисты, QA, sales, finance и PM.'],['10','КАРЬЕРА','Специалист → lead → plant manager → project/operating partner.'],['11','МОДЕЛЬ','Core team + технологические и отраслевые эксперты.'],['12','ПИЛОТ','Первый хаб задаёт производственные и коммерческие стандарты.'],['13','МАСШТАБ','Capacity expansion → новые продукты → новые регионы.'],['14','МИССИЯ','Больше переработки внутри страны — больше рабочих мест и добавленной стоимости.'],['15','ФИНАЛ','AGROHUB ищет людей, которые понимают и производство, и бизнес-результат.']]},partner:{q:'Что AGROHUB может дать агробизнесу?',s:'Инфраструктурный партнёр для хранения, переработки и выхода на рынки.',x:[['01','ХРАНЕНИЕ','Снижение потерь и управление сезонностью.'],['02','ПЕРЕРАБОТКА','Переход от сырья к продукту с более высокой добавленной стоимостью.'],['03','УПАКОВКА','Готовые форматы для B2B и retail.'],['04','ЛАБОРАТОРИЯ','Контроль качества и traceability.'],['05','ЛОГИСТИКА','Консолидация потоков и подготовка к отгрузке.'],['06','OFF-TAKE','Контрактные сценарии с покупателями.'],['07','ГИБКОСТЬ','Разные производственные партии и продукты.'],['08','ЭКСПОРТ','Инфраструктура под требования целевых рынков.'],['09','ЦИФРА','Прозрачность движения сырья и продукции.'],['10','СЕРВИС','Единая точка координации производственных процессов.'],['11','КАПИТАЛ','Инфраструктурная модель может снижать потребность каждого партнёра строить полный контур самостоятельно.'],['12','МАСШТАБ','Региональный хаб способен обслуживать несколько производителей.'],['13','РАЗВИТИЕ','Новые линии и продукты добавляются по подтверждённому спросу.'],['14','УСТОЙЧИВОСТЬ','Энергия, вода, waste и качество управляются системно.'],['15','ФИНАЛ','AGROHUB — место, где аграрный ресурс превращается в промышленный продукт.']]}};function show(k){let d=D[k],h='<section class="track hero"><div><div class="eyebrow">'+d.q+'</div><h1>AGRO<br>HUB</h1><p class="lead">'+d.s+'</p><div class="flow"><span>RAW</span><i class="arrow">→</i><span>STORE</span><i class="arrow">→</i><span>PROCESS</span><i class="arrow">→</i><span>MARKET</span></div></div><div class="photo" style="background-image:url('+photos[k==='investor'?0:k==='team'?1:2]+')"></div></section><section class="track section"><div class="grid">';d.x.forEach((z,i)=>h+='<article class="card"><span class="num">'+z[0]+'</span><b>'+z[1]+'</b><div class="muted">'+z[2]+'</div><div class="bar"><i style="width:'+((i%5+1)*18)+'%"></i></div></article>');h+='</div></section><section class="track section"><div class="cta"><div class="eyebrow">NEXT STEP</div><h2>'+(k==='investor'?'Сырьевая база → off-take → ТЭО → financing':k==='team'?'Технология → команда → pilot plant → scale':'Сырьё → переработка → контракт → отгрузка')+'</h2><p class="muted">Актуальные программы поддержки, гранты и инвестиционные механизмы зависят от конкретного проекта и требований программы.</p></div></section>';app.innerHTML=h}show('investor');</script></body></html>
