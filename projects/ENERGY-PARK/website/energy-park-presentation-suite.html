<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENERGY PARK — Presentation Suite</title><style>:root{--b:#070b10;--p:#111a22;--t:#f5f1e8;--m:#aab5bc;--g:#d7ad59;--l:#2b3b45}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px Arial,sans-serif}.top{position:sticky;top:0;z-index:5;padding:14px 4vw;background:#070b10ed;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:2px}.nav button{background:none;border:1px solid var(--l);color:var(--t);padding:7px 10px;margin:2px;border-radius:20px}.track{max-width:1240px;margin:auto;padding:30px 4vw 70px}.hero{min-height:76vh;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.hero h1{font:clamp(50px,8vw,98px) Georgia;color:var(--g);margin:10px 0}.lead{font-size:22px;line-height:1.45;color:#ddd8cb}.eyebrow{color:var(--g);letter-spacing:3px;font-size:12px;font-weight:700}.photo{height:460px;border-radius:18px;background:center/cover;border:1px solid var(--l)}.section{border-top:1px solid var(--l)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(145deg,#121d25,#0c141a);border:1px solid var(--l);border-radius:16px;padding:21px;min-height:155px}.num{color:var(--g);font-size:12px}.card b{display:block;font-size:19px;margin:9px 0}.muted{color:var(--m);line-height:1.5}.bar{height:8px;background:#202d34;border-radius:8px;margin-top:14px}.bar i{display:block;height:100%;background:var(--g)}.flow{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px}.flow span{border:1px solid var(--l);padding:10px 12px;border-radius:10px}.arrow{color:var(--g)}.cta{border:1px solid #6f5930;border-radius:18px;padding:32px;background:#15150f}.cta h2{font:38px Georgia;margin:10px 0}@media(max-width:800px){.hero{grid-template-columns:1fr}.photo{height:300px}.grid{grid-template-columns:1fr}.top{display:block}}
</style></head><body><div class="top"><div class="brand">MMW-COMPANY / ENERGY PARK</div><div class="nav"><button onclick="show('investor')">INVESTOR</button><button onclick="show('team')">TEAM</button><button onclick="show('offtaker')">PARTNER</button></div></div><main id="app"></main><script>const photos=['https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=1400&q=85','https://images.unsplash.com/photo-1466611653911-95081537e5b7?auto=format&fit=crop&w=1400&q=85','https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1400&q=85'];const D={investor:{q:'Почему капитал должен работать в ENERGY PARK?',s:'Энергетическая инфраструктура нового поколения: generation, storage, grid services и индустриальные потребители.',x:[['01','ПРОБЛЕМА','Промышленность и инфраструктура нуждаются в устойчивой, предсказуемой и гибкой энергии.'],['02','ПРОДУКТ','Energy generation + storage + grid connection + industrial demand в единой модели.'],['03','SITE','Площадка оценивается по grid capacity, земле, ресурсам, подключению и близости потребителей.'],['04','TECH','Солнечная/ветровая генерация, BESS и другие технологии выбираются по ТЭО.'],['05','REVENUE','Продажа энергии, услуги балансирования/хранения и инфраструктурные контракты — по выбранной модели.'],['06','CAPEX','Генерация, BESS, сети, подстанция, земля, EPC и резервирование.'],['07','BANKABILITY','Долгосрочные contracts/offtake и прозрачная проектная структура повышают инвестиционную устойчивость.'],['08','DIGITAL','EMS, forecasting, monitoring и аналитика управляют производством и потреблением.'],['09','РИСКИ','Grid connection, regulation, technology, FX, construction, offtake и security.'],['10','SPV','Отдельная проектная компания может структурировать актив, капитал и договоры.'],['11','ROADMAP','Site → grid study → resource → offtake → FEED/ТЭО → financing → EPC → commissioning.'],['12','RESILIENCE','Резервирование и storage помогают снижать последствия перебоев.'],['13','МАСШТАБ','Пилот → региональный парк → портфель энергетических активов.'],['14','INDUSTRY','Energy Park может быть якорем для производства, storage и других индустриальных потребителей.'],['15','ФИНАЛ','ENERGY PARK — энергетический актив, где технология и контрактная экономика должны быть доказаны до CAPEX.']]},team:{q:'Почему я хочу строить энергетическую инфраструктуру?',s:'Команда соединяет энергетику, инженерную экономику, цифровое управление и индустриальный спрос.',x:[['01','POWER','Генерация и расчёт энергетического баланса.'],['02','GRID','Подключение, подстанции, protection и dispatch.'],['03','STORAGE','BESS, cycling, degradation и управление режимами.'],['04','ENGINEERING','Civil, electrical, automation, fire safety и HSE.'],['05','DIGITAL','EMS, SCADA, forecasting, monitoring и dashboards.'],['06','COMMERCIAL','Offtake, PPAs/контракты и индустриальные потребители.'],['07','PROJECT MANAGEMENT','Schedule, CAPEX, procurement, EPC и commissioning.'],['08','FINANCE','Model, debt/equity, DSCR, sensitivities и risk.'],['09','КОГО ИЩЕМ','Энергетики, инженеры, PM, finance, legal, digital и commercial.'],['10','КАРЬЕРА','Инженер → lead → PM → asset manager → partner.'],['11','МОДЕЛЬ','Core team + технологические и EPC-партнёры.'],['12','ПИЛОТ','Один объект создаёт стандарт для портфеля.'],['13','МАСШТАБ','Energy asset → park → network.'],['14','КУЛЬТУРА','Безопасность, точность расчётов и ответственность за uptime.'],['15','ФИНАЛ','ENERGY PARK собирает людей, которые хотят строить инфраструктуру на десятилетия.']]},offtaker:{q:'Что ENERGY PARK даёт промышленному партнёру?',s:'Энергетическая инфраструктура как сервис: предсказуемость, резервирование и масштаб.',x:[['01','RELIABILITY','Снижение зависимости от одного источника.'],['02','POWER','Доступ к дополнительной генерации при выбранной модели.'],['03','STORAGE','Накопление и управление пиковыми нагрузками.'],['04','COST','Оптимизация энергетического профиля.'],['05','RESILIENCE','Резервирование для критических процессов.'],['06','DIGITAL','Мониторинг потребления и качества энергии.'],['07','FLEXIBILITY','Система может масштабироваться по мере роста предприятия.'],['08','ESG','Снижение углеродной интенсивности при соответствующем энергомиксе.'],['09','INFRA','Подстанции, сети и инженерная инфраструктура как часть решения.'],['10','OFFTAKE','Долгосрочные договоры создают понятную коммерческую рамку.'],['11','CAPEX','Часть инфраструктуры может быть вынесена в отдельную проектную модель.'],['12','SPEED','Готовая проектная команда сокращает путь от идеи до реализации.'],['13','SCALE','Новые мощности добавляются по подтверждённому спросу.'],['14','SECURITY','Проектирование учитывает эксплуатационные и физические риски.'],['15','ФИНАЛ','ENERGY PARK — партнёр по энергетической устойчивости, а не просто генератор.']]}};function show(k){let d=D[k],h='<section class="track hero"><div><div class="eyebrow">'+d.q+'</div><h1>ENERGY<br>PARK</h1><p class="lead">'+d.s+'</p><div class="flow"><span>GENERATE</span><i class="arrow">→</i><span>STORE</span><i class="arrow">→</i><span>MANAGE</span><i class="arrow">→</i><span>SUPPLY</span></div></div><div class="photo" style="background-image:url('+photos[k==='investor'?0:k==='team'?1:2]+')"></div></section><section class="track section"><div class="grid">';d.x.forEach((z,i)=>h+='<article class="card"><span class="num">'+z[0]+'</span><b>'+z[1]+'</b><div class="muted">'+z[2]+'</div><div class="bar"><i style="width:'+((i%5+1)*18)+'%"></i></div></article>');h+='</div></section><section class="track section"><div class="cta"><div class="eyebrow">NEXT STEP</div><h2>'+(k==='investor'?'Grid study → offtake → ТЭО → financing':k==='team'?'Concept → engineering → pilot → portfolio':'Load profile → energy solution → contract → delivery')+'</h2><p class="muted">Технология, мощность, CAPEX и доходность определяются конкретной площадкой, grid study, технологическим ТЭО и договорами.</p></div></section>';app.innerHTML=h}show('investor');</script></body></ht
